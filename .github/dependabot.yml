version: 2

updates:
  # Keeps the pinned action SHAs current — pinning is only safe if something
  # moves the pin when a fix lands.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /expo-app
    schedule:
      interval: weekly
    # Expo packages are versioned together by the SDK, so let `expo install`
    # move them rather than opening a pull request per package.
    ignore:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react-native
      - dependency-name: react
      - dependency-name: react-dom

  - package-ecosystem: gradle
    directory: /android-host
    schedule:
      interval: weekly
