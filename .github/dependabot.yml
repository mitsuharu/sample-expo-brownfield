version: 2

updates:
  # Keeps the pinned action SHAs current — pinning is only safe if something
  # moves the pin when a fix lands.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /expo-app
    schedule:
      interval: weekly
    # Expo packages are versioned together by the SDK, so let `expo install`
    # move them rather than opening a pull request per package.
    ignore:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react-native
      - dependency-name: react
      - dependency-name: react-dom
    # A dependency lands in the first group it matches, so the narrow groups
    # come before the catch-all ones.
    groups:
      jest:
        patterns:
          - jest
          - jest-*
          - '@types/jest'
          - '@react-native/jest-preset'
      testing-library:
        patterns: ['@testing-library/*']
      biome:
        patterns: ['@biomejs/*']
      babel:
        patterns:
          - babel-preset-expo
          - '@babel/*'
      typescript:
        patterns:
          - typescript
          - '@types/*'

  - package-ecosystem: gradle
    directory: /android-host
    schedule:
      interval: weekly
    groups:
      test:
        patterns:
          - junit:*
          - org.robolectric:*
          - androidx.test:*
      compose:
        patterns: ['androidx.compose*']
      androidx:
        patterns: ['androidx.*']
