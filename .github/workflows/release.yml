name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release
        required: true

permissions:
  contents: write

# Release artifacts are deliberately built without a build cache: a stale
# restore would ship the wrong binaries.
jobs:
  preflight:
    name: Resolve the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve and validate the tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::'$TAG' is not a version number. Expected 1.2.3, with no v prefix."
              exit 1
            fi
            # The tag is created by the release job, once the artifacts exist.
            # Refusing here keeps a released version from being rebuilt from a
            # different commit.
            if gh api "repos/$REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
              echo "::error::Tag $TAG already exists. Push it to release it, or pick a new version."
              exit 1
            fi
            echo "$TAG will be created on ${{ github.ref_name }} (${{ github.sha }}) after the artifacts are built."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  ios:
    name: iOS artifacts
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      # No ref: the default is github.sha, which is the tagged commit on a tag
      # push and the head of the selected branch on a manual run.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcodes select "$(cat .xcode-version)"
          xcodebuild -version

      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - name: Install dependencies
        working-directory: expo-app
        run: npm ci

      - name: Generate the native project
        working-directory: expo-app
        run: npm run prebuild:ios

      # Swift Package: one aggregate library the host app adds as a local
      # package. This is the form the sample itself consumes.
      - name: Build the Swift Package
        working-directory: expo-app
        run: npm run brownfield:ios

      # Plain xcframeworks, for host apps that wire the binaries up
      # themselves rather than going through SPM. Written to a separate
      # artifacts directory so the two outputs do not overwrite each other.
      - name: Build the plain xcframeworks
        working-directory: expo-app
        run: npx expo-brownfield build:ios --release --artifacts ./artifacts-xcframeworks

      - name: Package the artifacts
        working-directory: expo-app
        run: |
          mkdir -p ../dist
          ditto -c -k --keepParent --sequesterRsrc \
            artifacts/RepoSearchKitPackage-release \
            "../dist/RepoSearchKitPackage-${TAG}-spm.zip"
          ditto -c -k --keepParent --sequesterRsrc \
            artifacts-xcframeworks \
            "../dist/RepoSearchKit-${TAG}-xcframeworks.zip"
          ls -lh ../dist

      - name: Upload the artifacts for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios
          path: dist/*.zip
          retention-days: 1

  android:
    name: Android artifacts
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      # No ref: the default is github.sha, which is the tagged commit on a tag
      # push and the head of the selected branch on a manual run.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - name: Install dependencies
        working-directory: expo-app
        run: npm ci

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Generate the native project
        working-directory: expo-app
        run: npm run prebuild:android

      - name: Build and publish the AAR
        working-directory: expo-app
        run: npm run brownfield:android

      # The whole Maven layout, not just the AAR: consumers need the POM and
      # the Gradle module metadata to resolve react-android and hermes-android.
      - name: Package the artifacts
        run: |
          mkdir -p dist
          (cd android-host && zip -qr "../dist/reposearchkit-${TAG}-maven-repo.zip" local-repo)
          find android-host/local-repo -name '*.aar' -path '*reposearchkit*' \
            -exec cp {} "dist/reposearchkit-${TAG}.aar" \;
          ls -lh dist

      - name: Upload the artifacts for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist/*
          retention-days: 1

  release:
    name: Publish the release
    needs: [preflight, ios, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download the artifacts from both platforms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List the artifacts
        run: ls -lh dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          # Creates the tag on a manual run; ignored when the tag already
          # exists, which is the case for a tag push.
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
